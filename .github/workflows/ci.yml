name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ─── Stage 1: Code Quality (runs in parallel) ──────────────────────────────

  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: ESLint
        run: npx eslint . --max-warnings=0
        continue-on-error: true  # Remove once ESLint is configured
      - name: Prettier
        run: npx prettier --check .
        continue-on-error: true  # Remove once Prettier is configured

  # ─── Stage 2: Security Scanning (runs in parallel) ─────────────────────────

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Audit dependencies (high and critical only)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ─── Stage 3: Tests ────────────────────────────────────────────────────────

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [type-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - name: Coverage summary
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [type-check]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run database migrations
        run: npx drizzle-kit migrate
      - name: Run integration tests
        run: npm test

  # ─── Stage 4: Build Verification ───────────────────────────────────────────

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Build TypeScript
        run: npx tsc
        continue-on-error: true  # Remove once noEmit is removed from tsconfig
      - name: Verify package structure
        run: |
          node --input-type=module --eval "
            import { readFileSync } from 'fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            if (!pkg.name || !pkg.version) throw new Error('Invalid package.json');
            console.log('Package: ' + pkg.name + '@' + pkg.version);
          "

  # ─── Stage 5: CI Gate (all required jobs must pass) ────────────────────────

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - type-check
      - dependency-audit
      - unit-tests
      - integration-tests
      - build
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.type-check.result }}" != "success" ||
                "${{ needs.dependency-audit.result }}" != "success" ||
                "${{ needs.unit-tests.result }}" != "success" ||
                "${{ needs.integration-tests.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more required CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed"
